name: aucorsa
description: "Simple yet beautiful, public transport app for Cordoba, Spain."
publish_to: 'none'
version: 1.6.0+15

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  archive: ^4.0.9
  auto_size_text: ^3.0.0
  crypto: ^3.0.7
  dio: ^5.7.0
  duration: ^4.0.3
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_device_compass: ^2.2.0
  flutter_dotenv: ^6.0.0
  flutter_inappwebview: ^6.2.0-beta.2
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.3
  go_router: ^18.0.0
  go_transitions: ^0.8.3
  google_fonts: ^9.0.0
  html: ^0.15.5
  hydrated_bloc: ^11.0.0
  in_app_review: ^2.0.10
  intl: ^0.20.2
  latlong2: ^0.10.1
  maplibre: ^0.3.5
  material_symbols_icons: ^4.2873.0
  material_ui: ^1.8.0
  motor: ^1.1.0
  nfc_manager: ^4.0.2
  package_info_plus: ^10.0.0
  path_provider: ^2.1.5
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  very_good_infinite_list: ^0.9.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  image_path: assets/icons/icon_app.png

  # iOS uses the native Icon Composer asset at ios/Runner/aucorsa.icon.
  ios: false

  android: true
  adaptive_icon_foreground: assets/icons/icon_app_foreground.png
  adaptive_icon_monochrome: "assets/icons/icon_app_grayscale.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  image_ios: assets/icons/splash_transparent.png
  color: "#FFFFFF"
  color_dark: "#000000"

  android_12:
    image: assets/icons/splash_transparent.png
    color: "#FFFFFF"
    color_dark: "#000000"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - .env
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
